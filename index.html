<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Highway Drive V3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;padding:0;
  width:100%;height:100%;
  overflow:hidden;
  background:#05080c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}

/* ---------- TOP BAR ---------- */
.topbar{
  position:absolute;
  top:calc(8px + env(safe-area-inset-top,0px));
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:6px;
}

.box{
  padding:6px 10px;
  border-radius:12px;
  background:rgba(5,10,16,.72);
  border:1px solid rgba(255,255,255,.13);
  color:#fff;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  text-align:center;
  min-width:70px;
}

.label{
  font-size:8px;
  letter-spacing:.08em;
  color:#9fb0c0;
}

.value{
  font-size:15px;
  font-weight:700;
  line-height:1.25;
}

.iconBtn{
  pointer-events:auto;
  width:42px;height:42px;
  flex:0 0 auto;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(5,10,16,.72);
  color:#fff;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.iconBtn:active{transform:scale(.93);background:#16283a;}

/* ---------- SPEEDOMETER ---------- */
#speed{
  position:absolute;
  right:calc(12px + env(safe-area-inset-right,0px));
  bottom:calc(128px + env(safe-area-inset-bottom,0px));
  width:96px;height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#speed svg{
  position:absolute;
  inset:0;
  width:100%;height:100%;
}

.ringBg{
  fill:rgba(5,10,16,.72);
  stroke:rgba(255,255,255,.12);
  stroke-width:6;
}

.ringFg{
  fill:none;
  stroke:#38b6ff;
  stroke-width:6;
  stroke-linecap:round;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  transform:rotate(-90deg);
  transform-origin:60px 60px;
  filter:drop-shadow(0 0 4px rgba(56,182,255,.6));
}

.speedText{
  position:relative;
  text-align:center;
  color:#fff;
}

#speedNumber{
  font-size:22px;
  font-weight:800;
  line-height:1;
}

#speedUnit{
  font-size:8px;
  color:#9fb0c0;
  letter-spacing:.1em;
}

/* ---------- CONTROLS ---------- */
.controls{
  position:absolute;
  left:0;right:0;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 16px;
  pointer-events:auto;
}

.controlGroup{
  display:flex;
  gap:10px;
  align-items:flex-end;
}

.button{
  width:66px;height:66px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(8,15,23,.82);
  color:#fff;
  font-size:26px;
  font-weight:700;
  box-shadow:0 8px 22px rgba(0,0,0,.55);
  touch-action:none;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .06s, background .1s;
}

.button:active,.button.on{
  transform:scale(.93);
  background:#1d3purple;
  background:#1d3448;
}

#accelerate{
  width:78px;height:100px;
  border-radius:40px;
  font-size:12px;
  letter-spacing:.06em;
  background:rgba(16,54,80,.9);
  border-color:rgba(56,182,255,.4);
}

#accelerate:active,#accelerate.on{
  background:#14567f;
}

#brake{
  font-size:11px;
  letter-spacing:.04em;
  height:78px;
  background:rgba(70,20,24,.85);
  border-color:rgba(255,90,90,.3);
}

#brake:active,#brake.on{background:#8a2028;}

/* ---------- TOAST ---------- */
#toast{
  position:absolute;
  top:calc(70px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translateX(-50%) translateY(-6px);
  padding:8px 16px;
  border-radius:12px;
  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-weight:700;
  font-size:13px;
  opacity:0;
  transition:opacity .18s, transform .18s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ---------- OVERLAYS ---------- */
.overlay{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(rgba(2,8,14,.78),rgba(2,7,12,.96));
  overflow:auto;
}

.overlay.hidden{display:none;}

.menuBox{
  width:min(430px,100%);
  padding:26px 24px;
  border-radius:26px;
  background:rgba(9,16,24,.95);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 26px 90px #000;
  text-align:center;
}

.menuBox h1{
  margin:4px 0 2px;
  font-size:30px;
  letter-spacing:.04em;
  color:#fff;
}

.menuBox .sub{
  color:#9fb0c0;
  font-size:10px;
  letter-spacing:.22em;
  margin-bottom:14px;
}

.menuBox p{
  color:#aeb8c4;
  font-size:13px;
  line-height:1.65;
  margin:0 0 14px;
}

.menuButton{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#168cf0;
  color:#fff;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em;
  touch-action:none;
}

.menuButton:active{transform:scale(.98);filter:brightness(.9);}

.menuButton.secondary{
  background:#18232e;
  color:#dbe6f0;
}

.statsRow{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.stat{
  flex:1;
  padding:9px;
  border-radius:12px;
  background:#0d151d;
  border:1px solid rgba(255,255,255,.07);
}

.stat .k{font-size:9px;color:#8b9aa8;letter-spacing:.1em;}
.stat .v{font-size:16px;font-weight:800;color:#fff;}

/* ---------- GARAGE ---------- */
#garage{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:#070b10;
  color:#fff;
  touch-action:pan-y;
}

#garage.show{display:block;}

.garageHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  gap:10px;
}

.garageHead h2{margin:0;font-size:20px;}

.garageHead .right{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:14px;
}

.close{
  border:0;
  background:#1b2631;
  color:#fff;
  padding:10px 14px;
  border-radius:11px;
  font-weight:700;
  font-size:12px;
}

.carGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding-bottom:20px;
}

.carCard{
  background:#101820;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:12px;
  transition:border-color .15s;
}

.carCard.selected{border-color:#199cff;box-shadow:0 0 0 1px #199cff inset;}

.carVisual{
  height:92px;
  border-radius:13px;
  background:linear-gradient(160deg,#22323f,#070c11);
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:10px;
  overflow:hidden;
}

.carShape{
  width:46px;height:70px;
  border-radius:12px 12px 8px 8px;
  position:relative;
  box-shadow:0 10px 22px rgba(0,0,0,.6);
}

.carShape:before{
  content:"";
  position:absolute;
  left:6px;right:6px;top:9px;height:24px;
  border-radius:7px 7px 4px 4px;
  background:rgba(20,41,54,.92);
}

.carShape:after{
  content:"";
  position:absolute;
  left:-4px;right:-4px;bottom:9px;height:6px;
  background:#0a0d10;
  border-radius:4px;
}

.carCard h3{margin:4px 0 2px;font-size:14px;}
.carCard p{margin:0 0 9px;color:#93a1ae;font-size:10px;letter-spacing:.05em;}
.carCard .bar{height:4px;border-radius:3px;background:#1d2833;margin:6px 0 10px;overflow:hidden;}
.carCard .bar i{display:block;height:100%;background:#38b6ff;border-radius:3px;}

.carCard button{
  width:100%;
  padding:10px;
  border:0;
  border-radius:10px;
  background:#148df0;
  color:#fff;
  font-weight:700;
  font-size:12px;
  touch-action:none;
}

.carCard button:active{filter:brightness(.88);}
.carCard button.locked{background:#2b353f;color:#c3ced8;}
.carCard button.owned{background:#1b6b3a;}

/* ---------- PAUSE ---------- */
#pauseMenu .menuBox{max-width:340px;}

.flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 75%, rgba(255,60,60,.55), rgba(255,0,0,0) 60%);
  opacity:0;
  z-index:4;
}
</style>
</head>

<body>

<canvas id="game"></canvas>
<div class="flash" id="flash"></div>

<div id="hud">

  <div class="topbar">
    <div class="box">
      <div class="label">DISTANCE</div>
      <div class="value"><span id="distance">0.0</span> km</div>
    </div>

    <div class="box">
      <div class="label">COINS</div>
      <div class="value">🪙 <span id="coins">0</span></div>
    </div>

    <div class="box">
      <div class="label">BEST</div>
      <div class="value"><span id="best">0.0</span> km</div>
    </div>

    <button class="iconBtn" id="pauseBtn" aria-label="pause">❚❚</button>
  </div>

  <div id="toast"></div>

  <div id="speed">
    <svg viewBox="0 0 120 120">
      <circle class="ringBg" cx="60" cy="60" r="52"></circle>
      <circle class="ringFg" id="speedRing" cx="60" cy="60" r="52" pathLength="100"></circle>
    </svg>
    <div class="speedText">
      <div id="speedNumber">0</div>
      <div id="speedUnit">KM/H</div>
    </div>
  </div>

  <div class="controls">
    <div class="controlGroup">
      <button class="button" id="left">◀</button>
      <button class="button" id="right">▶</button>
    </div>

    <div class="controlGroup">
      <button class="button" id="brake">BRAKE</button>
      <button class="button" id="accelerate">ACCEL</button>
    </div>
  </div>

</div>


<!-- ============ MAIN MENU ============ -->
<div id="menu" class="overlay">
  <div class="menuBox">
    <div style="font-size:52px;line-height:1">🏁</div>
    <h1>HIGHWAY DRIVE</h1>
    <div class="sub">V3 · MOBILE EDITION</div>

    <p>
      Four-lane highway. Dodge traffic, collect coins,
      unlock faster cars.
    </p>

    <div class="statsRow">
      <div class="stat"><div class="k">BEST</div><div class="v"><span id="menuBest">0.0</span></div></div>
      <div class="stat"><div class="k">COINS</div><div class="v"><span id="menuCoins">0</span></div></div>
    </div>

    <button class="menuButton" id="startGame">START DRIVE</button>
    <button class="menuButton secondary" id="openGarage">GARAGE</button>
  </div>
</div>


<!-- ============ PAUSE ============ -->
<div id="pauseMenu" class="overlay hidden">
  <div class="menuBox">
    <h1 style="font-size:24px">PAUSED</h1>
    <div class="sub" id="pauseStats">—</div>

    <button class="menuButton" id="resumeGame">RESUME</button>
    <button class="menuButton secondary" id="pauseGarage">GARAGE</button>
    <button class="menuButton secondary" id="restartGame">RESTART</button>
    <button class="menuButton secondary" id="quitGame">MAIN MENU</button>
  </div>
</div>


<!-- ============ GARAGE ============ -->
<div id="garage">
  <div class="garageHead">
    <h2>🏎️ GARAGE</h2>
    <div class="right">
      🪙 <span id="garageCoins">0</span>
      <button class="close" id="closeGarage">CLOSE</button>
    </div>
  </div>
  <div class="carGrid" id="carGrid"></div>
</div>


<script>
(function(){
"use strict";

/* =========================================================
   HELPERS
========================================================= */

const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v < a ? a : (v > b ? b : v);
const el = id => document.getElementById(id);

function hash(n){
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function roundRect(c,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);
  c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);
  c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);
  c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);
  c.arcTo(x,y,x+r,y,r);
  c.closePath();
}


/* =========================================================
   CANVAS / LAYOUT
========================================================= */

const canvas = el("game");
const ctx = canvas.getContext("2d", { alpha:false });

let W = 0, H = 0, DPR = 1;
let HORIZON = 0, GROUND_Y = 0, ROAD_HALF = 0, LANE_PX = 0, CAR_SCALE = 1;
let bgCanvas = null;

const CAM_D = 0.32;
const Z_FAR = 4.5;

let curveAmp = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

  layout();
}

function layout(){
  HORIZON  = H * 0.30;
  GROUND_Y = H * 1.00;

  const span = Math.min(W, H * 0.95);
  ROAD_HALF  = span * 0.62;
  LANE_PX    = ROAD_HALF / 2;
  CAR_SCALE  = (LANE_PX * 0.60) / 46;

  buildBackground();
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=> setTimeout(resize,120));


/* =========================================================
   PROJECTION
========================================================= */

function project(lane, z){
  const d = z + CAM_D;
  const k = CAM_D / (d < 0.06 ? 0.06 : d);

  return {
    x: W * 0.5 + curveAmp * (1 - k) + lane * LANE_PX * k,
    y: HORIZON + (GROUND_Y - HORIZON) * k,
    k: k
  };
}


/* =========================================================
   BACKGROUND (pre-rendered once per resize)
========================================================= */

function buildBackground(){
  const h = Math.ceil(HORIZON + 2);
  bgCanvas = document.createElement("canvas");
  bgCanvas.width  = Math.max(1, Math.round(W * DPR));
  bgCanvas.height = Math.max(1, Math.round(h * DPR));

  const c = bgCanvas.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);

  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0.00,"#12283f");
  g.addColorStop(0.28,"#3a6a94");
  g.addColorStop(0.58,"#8ab3c9");
  g.addColorStop(0.82,"#d8c9a8");
  g.addColorStop(1.00,"#f0dcb0");
  c.fillStyle = g;
  c.fillRect(0,0,W,h);

  /* sun */
  const sx = W * 0.72, sy = HORIZON * 0.52, sr = Math.min(W,H) * 0.05;
  const sg = c.createRadialGradient(sx,sy,0,sx,sy,sr*5.5);
  sg.addColorStop(0.00,"rgba(255,252,235,1)");
  sg.addColorStop(0.14,"rgba(255,244,200,.85)");
  sg.addColorStop(0.42,"rgba(255,222,155,.26)");
  sg.addColorStop(1.00,"rgba(255,210,140,0)");
  c.fillStyle = sg;
  c.fillRect(sx-sr*5.5, sy-sr*5.5, sr*11, sr*11);

  c.fillStyle = "#fffbe8";
  c.beginPath(); c.arc(sx,sy,sr,0,TAU); c.fill();

  /* far hills */
  const n = 34;
  c.fillStyle = "rgba(72,102,112,.55)";
  c.beginPath();
  c.moveTo(0,HORIZON);
  for (let i=0;i<=n;i++){
    const x = i/n*W;
    const y = HORIZON - 6
      - (Math.sin(i*1.7)*0.5+0.5) * Math.min(72, H*0.09)
      - Math.sin(i*0.6) * Math.min(30, H*0.04);
    c.lineTo(x,y);
  }
  c.lineTo(W,HORIZON);
  c.closePath(); c.fill();

  /* near hills */
  c.fillStyle = "rgba(50,78,70,.78)";
  c.beginPath();
  c.moveTo(0,HORIZON);
  for (let i=0;i<=n;i++){
    const x = i/n*W;
    const y = HORIZON - 3
      - (Math.sin(i*2.3+1.4)*0.5+0.5) * Math.min(44, H*0.055);
    c.lineTo(x,y);
  }
  c.lineTo(W,HORIZON);
  c.closePath(); c.fill();

  /* horizon haze */
  const hz = c.createLinearGradient(0, HORIZON - H*0.11, 0, HORIZON);
  hz.addColorStop(0,"rgba(236,220,188,0)");
  hz.addColorStop(1,"rgba(236,220,188,.85)");
  c.fillStyle = hz;
  c.fillRect(0, HORIZON - H*0.11, W, H*0.11);
}


/* =========================================================
   SAVE DATA
========================================================= */

const SAVE_KEY = "HIGHWAY_DRIVE_V3";

let saveData = {
  coins: 0,
  best: 0,
  selected: 0,
  owned: [0],
  muted: false
};

try{
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw){
    const p = JSON.parse(raw);
    if (p && typeof p === "object"){
      saveData.coins    = Number(p.coins)    || 0;
      saveData.best     = Number(p.best)     || 0;
      saveData.selected = Number(p.selected) || 0;
      saveData.owned    = Array.isArray(p.owned) && p.owned.length ? p.owned : [0];
      saveData.muted    = !!p.muted;
    }
  }
}catch(e){ /* ignore corrupt save */ }

let saveTimer = null;

function save(instant){
  if (instant){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); }catch(e){}
    return;
  }
  if (saveTimer) return;
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); }catch(e){}
  }, 400);
}


/* =========================================================
   CARS
========================================================= */

const CARS = [
  { name:"Starter Hatch",  price:0,   max:170, accel:24, color:"#e6ebef", accent:"#9aa7b2", light:"#ffd9a0" },
  { name:"Sport Sedan",    price:120, max:215, accel:30, color:"#c62828", accent:"#7f1d1d", light:"#ffb3b3" },
  { name:"Electric GT",    price:280, max:250, accel:38, color:"#dde6ec", accent:"#5b6b78", light:"#c9f0ff" },
  { name:"Luxury Coupe",   price:480, max:285, accel:45, color:"#1b222a", accent:"#0c1015", light:"#ffd7a0" },
  { name:"Hyper Sport",    price:800, max:335, accel:57, color:"#f2c200", accent:"#8a6b00", light:"#fff0b0" }
];

const TRAFFIC_COLORS = [
  "#f2f2ef","#1a2129","#b3202c","#cfa730","#2f566e",
  "#5a6b52","#8b8f96","#7c3f1e","#2b3f8f","#a8a8a4"
];


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let engineOsc = null, engineOsc2 = null, engineGain = null, engineFilter = null;

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try{
    audioCtx = new AC();
  }catch(e){ return; }

  engineGain = audioCtx.createGain();
  engineGain.gain.value = 0;

  engineFilter = audioCtx.createBiquadFilter();
  engineFilter.type = "lowpass";
  engineFilter.frequency.value = 620;
  engineFilter.Q.value = 3;

  engineOsc = audioCtx.createOscillator();
  engineOsc.type = "sawtooth";
  engineOsc.frequency.value = 48;

  engineOsc2 = audioCtx.createOscillator();
  engineOsc2.type = "square";
  engineOsc2.frequency.value = 24;

  const g2 = audioCtx.createGain();
  g2.gain.value = 0.35;

  engineOsc.connect(engineFilter);
  engineOsc2.connect(g2);
  g2.connect(engineFilter);

  engineFilter.connect(engineGain);
  engineGain.connect(audioCtx.destination);

  engineOsc.start();
  engineOsc2.start();
}

function resumeAudio(){
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function updateEngineAudio(){
  if (!audioCtx || saveData.muted) return;

  const car = CARS[saveData.selected] || CARS[0];
  const r = clamp(speed / car.max, 0, 1);
  const t = audioCtx.currentTime;

  const f = 46 + r * 132;
  engineOsc.frequency.setTargetAtTime(f, t, 0.07);
  engineOsc2.frequency.setTargetAtTime(f * 0.5, t, 0.07);
  engineFilter.frequency.setTargetAtTime(420 + r * 1500, t, 0.09);

  const target = (state === "playing")
    ? 0.018 + r * 0.032
    : 0;

  engineGain.gain.setTargetAtTime(target, t, 0.15);
}

function playCoin(){
  if (!audioCtx || saveData.muted) return;
  const t = audioCtx.currentTime;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = "triangle";
  o.frequency.setValueAtTime(920, t);
  o.frequency.exponentialRampToValueAtTime(1780, t + 0.09);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.10, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.2);
}

function playCrash(){
  if (!audioCtx || saveData.muted) return;
  const t = audioCtx.currentTime;

  const len = Math.floor(audioCtx.sampleRate * 0.35);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++){
    d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.2);
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;

  const f = audioCtx.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 850;

  const g = audioCtx.createGain();
  g.gain.value = 0.32;

  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t);
}

/* =========================================================
   GAME STATE
========================================================= */

const LANES = [-1.5, -0.5, 0.5, 1.5];

let state = "menu";           // menu | playing | paused

let speed = 0;
let lateral = 0;
let distance = 0;
let roadOffset = 0;

let traffic = [];
let coins = [];
let particles = [];

let trafficTimer = 0;
let coinTimer = 0;

let shake = 0;
let hitFlash = 0;
let lean = 0;

let lastTime = performance.now();

const input = { left:false, right:false, accelerate:false, brake:false };

const COLLIDE_Z = 0.075;
const COIN_Z    = 0.075;

let lastDistTxt = "";
let lastSpeedTxt = "";
let lastRingVal = -1;


/* =========================================================
   RESET
========================================================= */

function resetGame(){
  speed = 0;
  lateral = 0;
  distance = 0;
  roadOffset = 0;
  traffic = [];
  coins = [];
  particles = [];
  trafficTimer = 0;
  coinTimer = 0;
  shake = 0;
  hitFlash = 0;
  lean = 0;
  curveAmp = 0;

  input.left = input.right = input.accelerate = input.brake = false;

  lastDistTxt = "";
  lastSpeedTxt = "";
  lastRingVal = -1;

  uiDistance.textContent = "0.0";
  uiSpeed.textContent = "0";
  uiRing.style.strokeDashoffset = 100;
}


/* =========================================================
   INPUT BINDING
========================================================= */

function bindHold(id, key){
  const b = el(id);

  const down = e => {
    e.preventDefault();
    input[key] = true;
    b.classList.add("on");
    try{ b.setPointerCapture(e.pointerId); }catch(_){}
  };

  const up = () => {
    input[key] = false;
    b.classList.remove("on");
  };

  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointercancel", up);
  b.addEventListener("lostpointercapture", up);
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("touchstart", e => e.preventDefault(), { passive:false });
}

bindHold("left", "left");
bindHold("right", "right");
bindHold("accelerate", "accelerate");
bindHold("brake", "brake");

const KEYMAP = {
  ArrowLeft:"left", a:"left", A:"left",
  ArrowRight:"right", d:"right", D:"right",
  ArrowUp:"accelerate", w:"accelerate", W:"accelerate",
  ArrowDown:"brake", s:"brake", S:"brake",
  " ":"brake"
};

window.addEventListener("keydown", e => {
  const k = KEYMAP[e.key];
  if (k){ input[k] = true; e.preventDefault(); }
  if (e.key === "Escape" || e.key === "p" || e.key === "P"){
    if (state === "playing") pauseGame();
    else if (state === "paused") resumeGame();
  }
});

window.addEventListener("keyup", e => {
  const k = KEYMAP[e.key];
  if (k){ input[k] = false; e.preventDefault(); }
});

/* prevent double-tap zoom on the whole document */
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());


/* =========================================================
   SPAWNING
========================================================= */

function spawnTraffic(){
  if (traffic.length > 16) return;

  const lane = LANES[(Math.random()*4)|0];

  for (let i=0;i<traffic.length;i++){
    const c = traffic[i];
    if (c.lane === lane && c.z > 2.0) return;
  }

  traffic.push({
    lane: lane,
    z: 3.2 + Math.random()*0.6,
    speedKmh: 55 + Math.random()*80,
    color: TRAFFIC_COLORS[(Math.random()*TRAFFIC_COLORS.length)|0],
    hit: false
  });
}

function spawnCoinLine(){
  const lane = LANES[(Math.random()*4)|0];

  for (let i=0;i<traffic.length;i++){
    const c = traffic[i];
    if (c.lane === lane && c.z > 1.6) return;
  }

  const n = 4 + ((Math.random()*3)|0);
  const gap = 0.028;

  for (let i=0;i<n;i++){
    coins.push({
      lane: lane,
      z: 2.6 + i*gap,
      rot: Math.random()*TAU
    });
  }
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnCrashParticles(x, y, color){
  for (let i=0;i<22;i++){
    particles.push({
      x: x,
      y: y,
      vx: (Math.random()-0.5) * 9,
      vy: -Math.random()*7 - 1,
      life: 1,
      size: 2 + Math.random()*3,
      color: Math.random() < 0.5 ? "#ffb648" : color
    });
  }
}

function updateParticles(dt){
  const step = dt * 60;
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx * step;
    p.y += p.vy * step;
    p.vy += 0.42 * step;
    p.life -= 0.028 * step;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function drawParticles(){
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    ctx.globalAlpha = clamp(p.life,0,1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){
  const car = CARS[saveData.selected] || CARS[0];

  /* ---------- throttle ---------- */
  if (input.accelerate){
    speed += car.accel * dt;
  } else {
    speed -= speed * 0.45 * dt;
  }

  if (input.brake){
    speed -= 130 * dt;
  }

  speed = clamp(speed, 0, car.max);

  /* ---------- steering ---------- */
  const steerRate = 3.6 * (1 - 0.32 * (speed / car.max));
  let steerInput = 0;

  if (input.left)  { lateral -= steerRate * dt; steerInput = -1; }
  if (input.right) { lateral += steerRate * dt; steerInput = 1; }

  lateral = clamp(lateral, -1.85, 1.85);

  lean += (steerInput - lean) * Math.min(1, dt * 9);

  /* ---------- world scroll ---------- */
  const dzPerSec = speed / 432;

  roadOffset += dzPerSec * dt;
  distance   += (speed / 3600) * dt;

  curveAmp = Math.sin(roadOffset * 0.45) * W * 0.10;

  /* ---------- traffic ---------- */
  trafficTimer -= dt;
  if (trafficTimer <= 0){
    spawnTraffic();
    const interval = clamp(1.5 - speed * 0.0035, 0.42, 1.5);
    trafficTimer = interval * (0.7 + Math.random()*0.6);
  }

  for (let i = traffic.length - 1; i >= 0; i--){
    const t = traffic[i];
    const zPrev = t.z;
    const rel = speed - t.speedKmh;

    t.z -= (rel / 432) * dt;

    if (!t.hit && zPrev > COLLIDE_Z && t.z <= COLLIDE_Z){
      if (Math.abs(t.lane - lateral) < 0.62){
        t.hit = true;
        onCrash(t);
      }
    }

    if (t.z < -0.06 || t.z > 4.6){
      traffic.splice(i,1);
    }
  }

  /* ---------- coins ---------- */
  coinTimer -= dt;
  if (coinTimer <= 0){
    spawnCoinLine();
    coinTimer = 1.1 + Math.random() * 1.3;
  }

  for (let i = coins.length - 1; i >= 0; i--){
    const c = coins[i];
    const zPrev = c.z;

    c.z -= dzPerSec * dt;
    c.rot += dt * 4.2;

    if (zPrev > COIN_Z && c.z <= COIN_Z){
      if (Math.abs(c.lane - lateral) < 0.62){
        saveData.coins++;
        save();
        updateUI();
        playCoin();
        coins.splice(i,1);
        continue;
      }
    }

    if (c.z < -0.08) coins.splice(i,1);
  }

  /* ---------- particles / fx ---------- */
  updateParticles(dt);

  if (shake > 0) shake = Math.max(0, shake - dt * 42);
  if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt * 2.6);
  uiFlash.style.opacity = hitFlash.toFixed(3);

  /* ---------- best ---------- */
  if (distance > saveData.best){
    saveData.best = distance;
    save();
  }

  /* ---------- HUD ---------- */
  const dTxt = distance.toFixed(1);
  if (dTxt !== lastDistTxt){
    lastDistTxt = dTxt;
    uiDistance.textContent = dTxt;
  }

  const sTxt = String(Math.round(speed));
  if (sTxt !== lastSpeedTxt){
    lastSpeedTxt = sTxt;
    uiSpeed.textContent = sTxt;
  }

  const pct = Math.round((speed / car.max) * 100);
  if (pct !== lastRingVal){
    lastRingVal = pct;
    uiRing.style.strokeDashoffset = (100 - pct);
    uiRing.style.stroke = pct > 85 ? "#ff6b4a" : (pct > 60 ? "#ffc93c" : "#38b6ff");
  }

  updateEngineAudio();
}

function onCrash(t){
  speed *= 0.34;
  shake = 16;
  hitFlash = 1;
  playCrash();

  const p = project(lateral, COLLIDE_Z);
  spawnCrashParticles(p.x, p.y, t.color);

  toast("💥 CRASH!");

  /* nudge the traffic car out of the way */
  t.z -= 0.06;
}


/* =========================================================
   DRAWING — ENVIRONMENT
========================================================= */

function drawBackground(){
  if (bgCanvas){
    ctx.drawImage(bgCanvas, 0, 0, W, HORIZON + 2);
  }
}

function drawRoad(){
  /* grass */
  ctx.fillStyle = "#4c6a45";
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  /* road polygon (curved) */
  const N = 16;

  ctx.beginPath();
  for (let i=0;i<=N;i++){
    const k = 1 - i/N;
    const z = CAM_D * (1/Math.max(k,0.012) - 1);
    const p = project(-2, z);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  for (let i=N;i>=0;i--){
    const k = 1 - i/N;
    const z = CAM_D * (1/Math.max(k,0.012) - 1);
    const p = project(2, z);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = "#2e3236";
  ctx.fill();

  /* asphalt sheen */
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = "#ffffff";
  for (let i=0;i<=N;i+=2){
    const k = 1 - i/N;
    const z = CAM_D * (1/Math.max(k,0.012) - 1);
    const a = project(-1.2, z);
    const b = project(-0.6, z);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 2);
    ctx.lineTo(a.x, a.y + 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* solid edge lines */
  drawSolidLine(-1.93, 0.055, "#e8e6da");
  drawSolidLine( 1.93, 0.055, "#e8e6da");

  /* dashed lane dividers */
  const DASH_PERIOD = 0.11;
  const DASH_LEN    = 0.030;
  const DASH_HW     = 0.032;
  const scroll = roadOffset % DASH_PERIOD;

  ctx.fillStyle = "#dcdcd2";

  for (let lane = -1; lane <= 1; lane++){
    for (let i=0;i<48;i++){
      let z0 = i * DASH_PERIOD - scroll;
      if (z0 > 1.8) break;

      let z1 = z0 + DASH_LEN;
      if (z1 <= 0.005) continue;

      if (z0 < 0.005) z0 = 0.005;

      const alpha = clamp(1 - z0 / 1.7, 0, 1);
      if (alpha < 0.04) continue;

      const p1 = project(lane - DASH_HW, z0);
      const p2 = project(lane + DASH_HW, z0);
      const p3 = project(lane + DASH_HW, z1);
      const p4 = project(lane - DASH_HW, z1);

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawSolidLine(lane, halfW, color){
  ctx.fillStyle = color;
  const N = 14;
  let pl = null, pr = null;

  for (let i=0;i<=N;i++){
    const k = 1 - i/N;
    const z = CAM_D * (1/Math.max(k,0.012) - 1);

    const l = project(lane - halfW, z);
    const r = project(lane + halfW, z);

    if (pl){
      ctx.beginPath();
      ctx.moveTo(pl.x, pl.y);
      ctx.lineTo(pr.x, pr.y);
      ctx.lineTo(r.x, r.y);
      ctx.lineTo(l.x, l.y);
      ctx.closePath();
      ctx.fill();
    }
    pl = l; pr = r;
  }
}


/* =========================================================
   DRAWING — ROADSIDE
========================================================= */

function drawRoadside(){
  const PROP_PERIOD = 0.30;
  const base = Math.floor(roadOffset / PROP_PERIOD);

  for (let i=0;i<24;i++){
    const idx = base + i;
    const z = idx * PROP_PERIOD - roadOffset;

    if (z < -0.05) continue;
    if (z > 3.2) break;

    const r1 = hash(idx);
    const r2 = hash(idx + 999);

    const s = project(-2.55, z);
    const sR = project(2.55, z);

    const scaleL = s.k * LANE_PX * 0.019;
    const scaleR = sR.k * LANE_PX * 0.019;

    if (scaleL > 0.25){
      if (r1 < 0.72) drawTree(s.x, s.y, scaleL, r1);
      else drawPost(s.x, s.y, scaleL);
    }

    if (scaleR > 0.25){
      if (r2 < 0.72) drawTree(sR.x, sR.y, scaleR, r2);
      else drawPost(sR.x, sR.y, scaleR);
    }

    /* occasional sign */
    if (r1 > 0.93 && scaleR > 0.5){
      drawSign(sR.x + 12*scaleR, sR.y, scaleR);
    }
  }
}

function drawTree(x, y, s, r){
  const trunk = 3 * s;
  ctx.fillStyle = "#3d3125";
  ctx.fillRect(x - trunk, y - 36*s, trunk*2, 36*s);

  ctx.fillStyle = r < 0.36 ? "#2c5a37" : "#356b3d";
  ctx.beginPath(); ctx.arc(x, y - 46*s, 16*s, 0, TAU); ctx.fill();

  ctx.fillStyle = r < 0.36 ? "#38714a" : "#408048";
  ctx.beginPath(); ctx.arc(x - 9*s, y - 38*s, 10.5*s, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 9*s, y - 40*s, 9.5*s, 0, TAU); ctx.fill();
}

function drawPost(x, y, s){
  ctx.fillStyle = "#c9ccd0";
  ctx.fillRect(x - 1.6*s, y - 30*s, 3.2*s, 30*s);
  ctx.fillStyle = "#ff5a3c";
  ctx.fillRect(x - 2.6*s, y - 32*s, 5.2*s, 5*s);
}

function drawSign(x, y, s){
  ctx.fillStyle = "#7d8288";
  ctx.fillRect(x - 1.2*s, y - 52*s, 2.4*s, 52*s);

  ctx.fillStyle = "#18536c";
  roundRect(ctx, x - 16*s, y - 62*s, 32*s, 18*s, 2.5*s);
  ctx.fill();

  ctx.fillStyle = "#9fd8ef";
  ctx.fillRect(x - 12*s, y - 57*s, 18*s, 2.5*s);
  ctx.fillRect(x - 12*s, y - 52*s, 12*s, 2.5*s);
}


/* =========================================================
   DRAWING — CARS
========================================================= */

function drawCar(x, y, s, color, accent, isPlayer, leanAmt, lightColor){
  ctx.save();
  ctx.translate(x, y);
  if (leanAmt) ctx.rotate(leanAmt * 0.05);

  /* shadow */
  ctx.fillStyle = "rgba(0,0,0,.42)";
  ctx.beginPath();
  ctx.ellipse(0, 5*s, 27*s, 10*s, 0, 0, TAU);
  ctx.fill();

  /* wheels */
  ctx.fillStyle = "#0a0c0f";
  ctx.fillRect(-26*s, -14*s, 8*s, 27*s);
  ctx.fillRect( 18*s, -14*s, 8*s, 27*s);

  /* body */
  ctx.fillStyle = color;
  roundRect(ctx, -23*s, -44*s, 46*s, 68*s, 9*s);
  ctx.fill();

  /* side shading */
  ctx.fillStyle = "rgba(0,0,0,.16)";
  roundRect(ctx, 12*s, -42*s, 10*s, 64*s, 6*s);
  ctx.fill();

  /* cabin */
  ctx.fillStyle = accent;
  roundRect(ctx, -17*s, -32*s, 34*s, 31*s, 7*s);
  ctx.fill();

  /* windshield (top of cabin = front) */
  ctx.fillStyle = "rgba(24,46,64,.92)";
  ctx.beginPath();
  ctx.moveTo(-14*s, -29*s);
  ctx.lineTo( 14*s, -29*s);
  ctx.lineTo( 12*s, -20*s);
  ctx.lineTo(-12*s, -20*s);
  ctx.closePath();
  ctx.fill();

  /* rear window */
  ctx.fillStyle = "rgba(18,36,52,.92)";
  ctx.beginPath();
  ctx.moveTo(-13*s, -13*s);
  ctx.lineTo( 13*s, -13*s);
  ctx.lineTo( 11*s,  -4*s);
  ctx.lineTo(-11*s,  -4*s);
  ctx.closePath();
  ctx.fill();

  /* roof highlight */
  ctx.fillStyle = "rgba(255,255,255,.14)";
  roundRect(ctx, -12*s, -19*s, 24*s, 5*s, 2*s);
  ctx.fill();

  /* tail lights */
  ctx.fillStyle = isPlayer ? "#ff3b30" : "#e0483a";
  ctx.fillRect(-19*s, 15*s, 11*s, 5*s);
  ctx.fillRect(  8*s, 15*s, 11*s, 5*s);

  /* light glow */
  ctx.fillStyle = lightColor || "rgba(255,120,90,.35)";
  ctx.fillRect(-20*s, 13.5*s, 13*s, 8*s);
  ctx.fillRect(  7*s, 13.5*s, 13*s, 8*s);

  /* front strip visible over the roof */
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.fillRect(-18*s, -42*s, 36*s, 3*s);

  /* player spoiler */
  if (isPlayer){
    ctx.fillStyle = "#12181e";
    roundRect(ctx, -24*s, 20*s, 48*s, 7*s, 3*s);
    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   DRAWING — COINS
========================================================= */

function drawCoin(x, y, s, rot){
  const r = Math.max(1.6, 9 * s);
  if (r < 1.4) return;

  const sq = Math.abs(Math.cos(rot)) * 0.78 + 0.22;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sq, 1);

  ctx.fillStyle = "rgba(255,200,60,.20)";
  ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();

  ctx.fillStyle = "#ffcc33";
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();

  ctx.strokeStyle = "#ffeaa0";
  ctx.lineWidth = Math.max(0.8, r * 0.22);
  ctx.stroke();

  if (r > 4.5){
    ctx.fillStyle = "#8a5a10";
    ctx.font = "bold " + (r * 1.15).toFixed(1) + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, r * 0.06);
  }

  ctx.restore();
}


/* =========================================================
   RENDER
========================================================= */

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0, 0, W, H);

  if (shake > 0.2){
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake * 0.6
    );
  }

  drawBackground();
  drawRoad();
  drawRoadside();

  /* coins */
  for (let i=0;i<coins.length;i++){
    const c = coins[i];
    if (c.z < -0.04) continue;
    const p = project(c.lane, c.z);
    drawCoin(p.x, p.y, p.k * CAR_SCALE, c.rot);
  }

  /* traffic */
  for (let i=0;i<traffic.length;i++){
    const t = traffic[i];
    if (t.z < -0.05) continue;

    const p = project(t.lane, t.z);
    const s = p.k * CAR_SCALE * 0.95;

    if (p.y - 70*s > H) continue;

    drawCar(p.x, p.y, s, t.color, "#16232e", false, 0, "rgba(255,140,110,.30)");
  }

  /* player */
  const car = CARS[saveData.selected] || CARS[0];
  const px = W * 0.5 + lateral * LANE_PX;

  drawCar(
    px,
    H * 0.87,
    CAR_SCALE * 0.95,
    car.color,
    car.accent,
    true,
    lean,
    "rgba(255,90,70,.45)"
  );

  /* particles */
  drawParticles();

  /* vignette */
  const vg = ctx.createLinearGradient(0, H * 0.62, 0, H);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,.38)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){
  let dt = (now - lastTime) / 1000;
  lastTime = now;

  if (dt > 0.1) dt = 0.1;
  if (dt < 0)   dt = 0;

  if (state === "playing"){
    update(dt);
  } else {
    /* keep ambient motion while paused/menu */
    if (state === "menu"){
      roadOffset += 0.25 * dt;
      curveAmp = Math.sin(roadOffset * 0.45) * W * 0.10;
    }
    updateParticles(dt);
    updateEngineAudio();
  }

  render();
  requestAnimationFrame(loop);
}


/* =========================================================
   STATE CONTROL
========================================================= */

function startGame(){
  initAudio();
  resumeAudio();

  resetGame();

  state = "playing";
  lastTime = performance.now();

  el("menu").classList.add("hidden");
  el("pauseMenu").classList.add("hidden");
  el("garage").classList.remove("show");

  toast("DRIVE STARTED");
}

function pauseGame(){
  if (state !== "playing") return;
  state = "paused";
  el("pauseStats").textContent =
    distance.toFixed(1) + " km · " + Math.round(speed) + " km/h";
  el("pauseMenu").classList.remove("hidden");
  updateEngineAudio();
}

function resumeGame(){
  if (state !== "paused") return;
  state = "playing";
  lastTime = performance.now();
  el("pauseMenu").classList.add("hidden");
  resumeAudio();
}

function quitToMenu(){
  state = "menu";
  el("pauseMenu").classList.add("hidden");
  el("garage").classList.remove("show");
  el("menu").classList.remove("hidden");
  resetGame();
  updateUI();
  updateEngineAudio();
}


/* =========================================================
   GARAGE
========================================================= */

function renderGarage(){
  uiCarGrid.innerHTML = "";

  CARS.forEach((car, index) => {
    const owned = saveData.owned.indexOf(index) !== -1;
    const selected = saveData.selected === index;

    const card = document.createElement("div");
    card.className = "carCard" + (selected ? " selected" : "");

    const pct = Math.round((car.max / 340) * 100);

    let btnLabel, btnClass;
    if (selected){ btnLabel = "SELECTED"; btnClass = "owned"; }
    else if (owned){ btnLabel = "SELECT"; btnClass = "owned"; }
    else { btnLabel = "🪙 " + car.price + " UNLOCK"; btnClass = "locked"; }

    card.innerHTML =
      '<div class="carVisual">' +
        '<div class="carShape" style="background:' + car.color + '"></div>' +
      '</div>' +
      '<h3>' + car.name + '</h3>' +
      '<p>TOP ' + car.max + ' KM/H · ACC ' + car.accel + '</p>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<button class="' + btnClass + '">' + btnLabel + '</button>';

    card.querySelector("button").addEventListener("click", () => {
      if (owned){
        saveData.selected = index;
        save(true);
        updateUI();
        renderGarage();
        toast(car.name + " selected");
        return;
      }

      if (saveData.coins >= car.price){
        saveData.coins -= car.price;
        saveData.owned.push(index);
        saveData.selected = index;
        save(true);
        updateUI();
        renderGarage();
        toast(car.name + " unlocked!");
      } else {
        toast("Need " + (car.price - saveData.coins) + " more coins");
      }
    });

    uiCarGrid.appendChild(card);
  });
}


/* =========================================================
   WIRING
========================================================= */

el("startGame").addEventListener("click", startGame);

el("openGarage").addEventListener("click", () => {
  renderGarage();
  el("garage").classList.add("show");
});

el("closeGarage").addEventListener("click", () => {
  el("garage").classList.remove("show");
});

el("pauseBtn").addEventListener("click", () => {
  if (state === "playing") pauseGame();
});

el("resumeGame").addEventListener("click", resumeGame);

el("restartGame").addEventListener("click", () => {
  startGame();
});

el("quitGame").addEventListener("click", quitToMenu);

el("pauseGarage").addEventListener("click", () => {
  renderGarage();
  el("garage").classList.add("show");
});

/* auto-pause when the tab/app goes to the background */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing"){
    pauseGame();
  }
});

window.addEventListener("blur", () => {
  if (state === "playing") pauseGame();
});


/* =========================================================
   BOOT
========================================================= */

resize();
updateUI();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
